
name: Build Plato APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o *.zip -d source

      - name: Fix Java JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source")

          for p in root.rglob("*"):
              if p.name not in ("build.gradle", "build.gradle.kts"):
                  continue

              s = p.read_text()
              old = s

              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              s = re.sub(
                  r'(?m)(sourceCompatibility|targetCompatibility)(\s*=\s*|\s+)(["\']?)1\.8\3',
                  r'\1\2JavaVersion.VERSION_17',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("Fixed:", p)

          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/PlatoPoolAimAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlatoPoolAimAssistant-APK
          path: source/PlatoPoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
          
