name: Build Plato APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir source
          unzip -o *.zip -d source

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/PlatoPoolAimAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlatoPoolAimAssistant-APK
          path: source/PlatoPoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
