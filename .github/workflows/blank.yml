
name: Build Plato APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o *.zip -d source

      - name: Force Java and Kotlin 17
        run: |
          cat > source/PlatoPoolAimAssistant/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.platoaim"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.platoaim"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/PlatoPoolAimAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlatoPoolAimAssistant-APK
          path: source/PlatoPoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
          
