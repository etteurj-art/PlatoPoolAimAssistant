
name: Build Plato APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o *.zip -d source

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure JVM targets
        run: |
          cat > /tmp/jvm17.init.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  tasks.withType(
                      org.gradle.api.tasks.compile.JavaCompile
                  ).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }

                  tasks.configureEach { task ->
                      if (task.class.name.contains('KotlinCompile')) {
                          task.kotlinOptions.jvmTarget = '17'
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd source/PlatoPoolAimAssistant
          gradle -I /tmp/jvm17.init.gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlatoPoolAimAssistant-APK
          path: source/PlatoPoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
          
